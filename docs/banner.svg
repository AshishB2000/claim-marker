<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="claim-marker — the accident report a customer can actually do at the roadside">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0.22"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1600" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1600" height="400" fill="url(#bg)"/>
    <rect width="1600" height="400" fill="url(#grid)"/>
    <rect x="900" width="700" height="400" fill="url(#glow)"/>

    <!-- the mark -->
    <rect x="96" y="148" width="104" height="104" rx="26" fill="#2f6bff"/>
    <rect x="96" y="148" width="104" height="104" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
    <g transform="translate(112 164) scale(3)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 17h14M6 17l1.5-6h9L18 17M4 11l2-5h12l2 5"/>
      <circle cx="7.5" cy="17" r="1.5"/>
      <circle cx="16.5" cy="17" r="1.5"/>
    </g>

    <!-- the name -->
    <text x="232" y="212" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="-2">claim-marker</text>
    <text x="236" y="262" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#94a3b8">The accident report a customer can actually do at the roadside.</text>

    <!-- a little diagram: two cars, the route one took, where they met -->
    <g transform="translate(1180 60)">
      <path d="M92 300 L92 210 Q92 170 130 150 L214 108" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12" opacity="0.9"/>
      <path d="M262 300 L262 176" fill="none" stroke="#2f6bff" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12" opacity="0.9"/>
      <!-- the other car, amber, coming in at an angle -->
      <g transform="translate(214 108) rotate(-30)">
        <rect x="-26" y="-58" width="52" height="116" rx="12" fill="#f59e0b" fill-opacity="0.22" stroke="#f59e0b" stroke-width="4"/>
        <path d="M0 -70 L-11 -56 L11 -56 Z" fill="#f59e0b"/>
      </g>
      <!-- the customer's car, blue, facing north -->
      <g transform="translate(262 176)">
        <rect x="-26" y="-58" width="52" height="116" rx="12" fill="#2f6bff" fill-opacity="0.28" stroke="#2f6bff" stroke-width="4"/>
        <path d="M0 -70 L-11 -56 L11 -56 Z" fill="#2f6bff"/>
        <rect x="-38" y="-96" width="76" height="26" rx="13" fill="#2f6bff"/>
        <text x="0" y="-78" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff">A</text>
      </g>
      <!-- where they met -->
      <circle cx="236" cy="132" r="18" fill="#dc2626" stroke="#ffffff" stroke-width="3"/>
      <path d="M229 125 L243 139 M243 125 L229 139" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
