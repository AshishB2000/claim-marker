# The whole product on http://localhost:8788 — the page, the claims desk and the API.
#
#   docker compose up --build
#
# Nothing here is required to start in development. For production set at least
# SESSION_SECRET (or CLAIM_TOKEN), DESK_TOKEN and ALLOWED_HOSTS: with NODE_ENV=production
# the server refuses to start without them.
services:
  claims:
    build: .
    ports: ['8788:8788']
    volumes: ['claims:/data']
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BRAND: ${BRAND:-}
      # who may put the page in an iframe; sets frame-ancestors
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      # the page's token: a shared secret, or per-customer sessions minted by your backend
      CLAIM_TOKEN: ${CLAIM_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      API_KEY: ${API_KEY:-}
      # the claims desk at /adjuster.html
      DESK_TOKEN: ${DESK_TOKEN:-}
      RATE_LIMIT: ${RATE_LIMIT:-30}
      # 1 when something in front of this sets X-Forwarded-For
      TRUST_PROXY: ${TRUST_PROXY:-}
      ASSIST_URL: ${ASSIST_URL:-}
      CONNECT_SRC: ${CONNECT_SRC:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}

volumes:
  claims:
