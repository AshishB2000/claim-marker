<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>claim-marker — vanilla mount()</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font: 14px/1.55 system-ui, sans-serif; background: #070a14; color: #e2e8f0; -webkit-font-smoothing: antialiased; }
      main { max-width: 960px; margin: 0 auto; padding: 32px 24px 64px; }
      a { color: #93c5fd; text-decoration: none; }
      a:hover { text-decoration: underline; }
      h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
      h1 code, p code { font-size: 0.9em; color: #93c5fd; }
      h2 { margin: 40px 0 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #64748b; }
      .lede { color: #94a3b8; margin: 8px 0 0; }
      .stage { height: 440px; border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 0 100px -30px rgba(59,130,246,.45); }
      .row { display: flex; gap: 8px; margin: 12px 0; }
      pre { margin: 0; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.06); color: #cbd5e1; padding: 12px 14px; border-radius: 12px; overflow: auto; font-size: 11.5px; line-height: 1.55; max-height: 240px; }
      button { padding: 8px 14px; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; background: rgba(255,255,255,.06); color: #e2e8f0; font: inherit; font-weight: 500; cursor: pointer; }
      button:hover { background: rgba(255,255,255,.1); }
      button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
      button.primary:hover { background: #60a5fa; }
    </style>
  </head>
  <body>
    <main>
      <a href="/">← Back to the React demo</a>
      <h1 style="margin-top: 12px">Vanilla <code>mount()</code></h1>
      <p class="lede">Both widgets with no React in the host page's own code. Each call returns a handle synchronously.</p>

      <h2>Damage marker · mount(el, { theme: 'dark' })</h2>
      <div id="damage" class="stage"></div>
      <div class="row"><button id="export" class="primary">export()</button> <button id="sample">load() a sample</button></div>
      <pre id="out">{}</pre>

      <h2>Accident scenario · mountScenario(el, { theme: 'dark' })</h2>
      <div id="scenario" class="stage"></div>
      <div class="row"><button id="scn-export" class="primary">export()</button> <button id="scn-sample">load() a sample</button></div>
      <pre id="scn-out">{}</pre>
    </main>
    <script type="module" src="/demo/vanilla.ts"></script>
  </body>
</html>
